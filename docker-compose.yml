# Môi trường phát triển local: n8n + Postgres
# Cách dùng:
#   1. cp .env.example .env   (rồi điền các giá trị)
#   2. docker compose up -d
#   3. Mở http://localhost:5678
#
# Dùng chung Docker image và Postgres với bản trên Render, nên workflow chạy local
# sẽ chạy y hệt khi deploy.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # --- Database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- URL & webhook ---
      # Webhook dùng URL public của ngrok để Stripe, Calendly, Slack... gọi vào được.
      # Giao diện editor vẫn mở qua http://localhost:5678
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: https://${NGROK_DOMAIN}/
      N8N_PROXY_HOPS: 1

      # --- Bảo mật ---
      # KHÔNG ĐỔI sau khi đã tạo credential, nếu đổi sẽ mất toàn bộ credential
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      # --- Timezone (ảnh hưởng tới Schedule Trigger) ---
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}

      # --- Vận hành ---
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168 # giờ (7 ngày)
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      # Thư mục để import/export workflow JSON bằng CLI:
      #   docker compose exec n8n n8n export:workflow --all --separate --output=/home/node/workflows
      #   docker compose exec n8n n8n import:workflow --separate --input=/home/node/workflows
      - ./workflows:/home/node/workflows
    depends_on:
      postgres:
        condition: service_healthy

  # Tunnel public để nhận webhook khi chạy local (domain tĩnh miễn phí của ngrok)
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["http", "n8n:5678", "--url=${NGROK_DOMAIN}", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
